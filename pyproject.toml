[project]
name = "mynaksh-context-engine"
version = "0.1.0"
description = "Personalized AI Context Engine — selects and optimizes astrological context for an LLM"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real LLM providers. Neither is required — the engine falls back to the mock
# provider when no API key is configured.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, because the repo has several top-level packages and auto-discovery
# refuses to guess between them.
packages = ["app", "app.api", "app.classifier", "app.engine", "app.llm", "app.middleware", "app.prompt", "app.services", "mock_services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
